# RSS AI Curator 极客早报配置文件

llm:
  api_key: "YOUR_API_KEY_HERE" # GitHub Actions 中通过 Secrets: LLM_API_KEY 注入
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"

curator:
  # 严格的主编打分及格线 (1.0 - 10.0 分)
  score_threshold: 7.5

  # 输出给 ReadYou 等 RSS 阅读器的最新精华文章/项目保留条数
  max_output_items: 40

  # 每天运行一次时，每个订阅源采集前 12 篇候选
  max_entries_per_feed: 12

  # 并发评估线程数
  max_workers: 4

# 订阅源列表：聚焦【GitHub Trending、3D打印模型、36氪商业科技、知乎精选】
# 注：GitHub Trending 与 拓竹 MakerWorld 热门 3D 模型已作为原生数据源直接在代码中稳定抓取
feeds:
  # -------------------- 【商业科技 / 产业与大模型创新】 --------------------
  - name: "36氪 (商业科技与创投动态)"
    url: "https://36kr.com/feed"

  # -------------------- 【知乎精选 / 深度知识与讨论】 --------------------
  - name: "知乎精选 (每日深度高赞)"
    url: "https://rsshub.rss.tips/zhihu/daily"

  # -------------------- 【数字生活与极客效率 (精选补充)】 --------------------
  - name: "少数派 (优质数字生活与效率生产力)"
    url: "https://sspai.com/feed"

output:
  feed_title: "⚡ 极客早餐速报 (Daily Geek Digest)"
  feed_description: "大模型严格把关：GitHub热榜 · 拓竹3D打印模型 · 36氪 · 知乎精选"
  feed_link: "https://github.com/Kevin8k86/RSS"
  output_file: "dist/feed.xml"

storage:
  db_path: "data/curator.db"
